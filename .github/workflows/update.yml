name: Update filtered TVBox config

on:
  schedule:
    # Refresh once a day at 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-tvbox-config
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and filter config
        env:
          PYTHONUTF8: "1"
        run: python scripts/filter_tvbox.py --output tvbox.json --report filter-report.json

      - name: Validate generated JSON
        run: python -c "import json; json.load(open('tvbox.json', encoding='utf-8')); print('tvbox.json is valid JSON')"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tvbox.json filter-report.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh filtered TVBox config"
          git push
